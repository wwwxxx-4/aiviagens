<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#185FA5"/>
      <stop offset="100%" stop-color="#0A3A66"/>
    </linearGradient>
    <linearGradient id="logoShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="1150" cy="540" r="260" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="80" cy="560" r="120" fill="#ffffff" fill-opacity="0.04"/>

  <!-- Logo tile -->
  <g transform="translate(96 168)">
    <rect width="180" height="180" rx="36" fill="#ffffff"/>
    <rect width="180" height="180" rx="36" fill="url(#logoShine)"/>
    <text x="90" y="122" text-anchor="middle"
          font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
          font-size="86" font-weight="700" fill="#185FA5">MT</text>
  </g>

  <!-- Main heading -->
  <text x="320" y="270"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff">
    Sua proposta de viagem
  </text>

  <!-- Subheading -->
  <text x="320" y="340"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="32" font-weight="400" fill="#ffffff" fill-opacity="0.85">
    Mesquita Turismo
  </text>

  <!-- Description -->
  <text x="320" y="408"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.75">
    Voos, hotéis e atividades organizados por
  </text>
  <text x="320" y="442"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.75">
    uma agência especializada.
  </text>

  <!-- Footer line -->
  <rect x="96" y="560" width="64" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.6"/>
  <text x="180" y="572"
        font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
        font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.85">
    mesquitaturismo.com.br
  </text>
</svg>
